  release:
    # Publie une Release GitHub quand on pousse un tag « v* » (ex. : git tag v0.0.2 && git push --tags).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Seulement les archives des plugins : ni les images de NovaGallery ni les mesures de performance (Perf-*).
          rm -f dist/*.png dist/*.json
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Neptune ${{ github.ref_name }}" \
            --generate-notes
