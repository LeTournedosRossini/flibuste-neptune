            7z a "../Arpege-${{ matrix.name }}.zip" Arpege.clap
          else
            tar -czf "../Arpege-${{ matrix.name }}.tar.gz" Arpege.clap
          fi
          cd ../..
          rm -rf dist-arp/stage
          ls -la dist-arp

      - uses: actions/upload-artifact@v7
        with:
          name: Arpege-${{ matrix.name }}
          path: dist-arp/*
          if-no-files-found: error

      # EssaiCarte séparé, archivé à part.
